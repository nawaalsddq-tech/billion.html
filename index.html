
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE IN A BILLI-ON</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:white;
  font-family:'VT323',monospace;
  font-size:24px;
  background:linear-gradient(#11113c,#30105e,#130d35);
}

body:before {
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 10% 20%,white 99%,transparent),
    radial-gradient(2px 2px at 30% 70%,white 99%,transparent),
    radial-gradient(2px 2px at 55% 30%,white 99%,transparent),
    radial-gradient(2px 2px at 80% 60%,white 99%,transparent),
    radial-gradient(2px 2px at 95% 15%,white 99%,transparent);
  background-size:220px 180px;
  animation:stars 15s linear infinite;
}

@keyframes stars {
  to { background-position:220px 180px; }
}

main {
  width:min(950px,94%);
  margin:auto;
  padding:20px 0 35px;
}

header {
  text-align:center;
  margin-bottom:15px;
}

h1 {
  font:clamp(17px,3vw,27px)/1.5 'Press Start 2P';
  color:#fff36b;
  text-shadow:4px 4px #ec45a2;
}

header p {
  color:#8df5ff;
  font-size:26px;
}

.hud {
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}

.hud span {
  background:#21164e;
  border:2px solid #9274ff;
  padding:8px 12px;
}

.scene {
  height:260px;
  position:relative;
  overflow:hidden;
  border:4px solid white;
  box-shadow:0 0 0 4px #ff70b7,0 0 25px #a75bff;
  background:linear-gradient(#171044,#29105e);
}

.rainbow {
  position:absolute;
  top:115px;
  left:0;
  width:100%;
  height:90px;
  background:linear-gradient(
    to bottom,
    #ff4b5c 0 16.6%,
    #ff9c40 16.6% 33.2%,
    #ffe85a 33.2% 49.8%,
    #53e66d 49.8% 66.4%,
    #48c9ff 66.4% 83%,
    #a66bff 83% 100%
  );
  animation:rainbow 2s linear infinite;
}

@keyframes rainbow {
  to { background-position:180px 0; }
}

.character {
  position:absolute;
  left:4%;
  top:65px;
  width:115px;
  height:115px;
  z-index:3;
  display:flex;
  justify-content:center;
  align-items:center;
  transition:left .9s ease;
}

.character img {
  display:none;
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;
}

.cat-placeholder {
  font-size:80px;
  filter:drop-shadow(4px 4px #170b38);
}

.cat-label {
  position:absolute;
  top:190px;
  left:4%;
  z-index:4;
  white-space:nowrap;
  transition:left .9s ease;
  text-shadow:2px 2px #000;
}

.question-box {
  margin-top:22px;
  padding:22px;
  background:rgba(18,10,55,.95);
  border:3px solid #62eaff;
  box-shadow:5px 5px #09051e;
}

.category {
  color:#ff83c4;
  font:11px 'Press Start 2P';
  line-height:1.8;
  margin-bottom:15px;
}

#question {
  font-size:34px;
  line-height:1.2;
  margin:0 0 12px;
}

.instructions {
  color:#c6bee9;
  font-size:21px;
}

.answer-row {
  display:flex;
  gap:10px;
}

input[type=text] {
  flex:1;
  min-width:0;
  padding:13px;
  border:3px solid #a88cff;
  background:white;
  color:#17102d;
  font:25px 'VT323';
  outline:none;
}

input[type=text]:focus {
  border-color:#fff36b;
}

button {
  border:3px solid white;
  padding:13px 16px;
  background:#ff70b7;
  color:#230d42;
  font:11px 'Press Start 2P';
  cursor:pointer;
  box-shadow:4px 4px #09051e;
}

button:hover {
  background:#fff36b;
}

button:disabled {
  opacity:.5;
  cursor:default;
}

#feedback {
  min-height:35px;
  margin-top:14px;
  color:#fff36b;
  font-size:25px;
}

#sourceStatus {
  color:#bdb2e8;
  font-size:17px;
  margin-top:8px;
}

.upload {
  display:inline-block;
  margin-top:14px;
  padding:8px;
  background:#49328d;
  color:white;
  font:9px 'Press Start 2P';
  cursor:pointer;
}

#memeUpload { display:none; }

.end {
  display:none;
  margin-top:20px;
  padding:25px;
  text-align:center;
  border:3px solid #fff36b;
  background:#21164e;
}

.end h2 {
  color:#fff36b;
  font:16px/1.8 'Press Start 2P';
}

@media(max-width:600px) {
  .scene { height:220px; }
  .rainbow { top:95px; height:75px; }
  .character { top:50px; width:90px; height:90px; }
  .cat-label { top:155px; }
  .answer-row { flex-direction:column; }
  button { min-height:48px; }
  #question { font-size:28px; }
}
</style>
</head>

<body>
<main>

<header>
  <h1>ONE IN A BILLI-ON</h1>
  <p>BHARGAVI'S COSMIC TRIVIA RUN</p>
</header>

<div class="hud">
  <span>ROUND <b id="round">1</b>/8</span>
  <span>SCORE <b id="score">0</b></span>
  <span>RANK <b id="rank">PLANKTON</b></span>
</div>

<section class="scene">
  <div class="rainbow"></div>
  <div class="character" id="character">
    <span class="cat-placeholder" id="placeholder">🐈</span>
    <img id="catImage" alt="Bhargavi">
  </div>
  <div class="cat-label" id="catLabel">BHARGAVI</div>
</section>

<section class="question-box" id="game">
  <div class="category" id="category">COSMIC TRIVIA</div>
  <h2 id="question">Loading question...</h2>
  <p class="instructions">
    Type your answer. The rarer the accepted answer, the farther Bhargavi travels.
  </p>

  <form id="answerForm">
    <div class="answer-row">
      <input
        type="text"
        id="answer"
        placeholder="Type your answer here..."
        autocomplete="off"
        required
      >
      <button type="submit" id="submit">SUBMIT</button>
    </div>
  </form>

  <div id="feedback" aria-live="polite"></div>
  <div id="sourceStatus">Loading the public answer archive...</div>

  <label class="upload" for="memeUpload">
    UPLOAD BHARGAVI'S MEME
  </label>
  <input type="file" id="memeUpload" accept="image/*">
</section>

<section class="end" id="end">
  <h2 id="endTitle">COSMIC JOURNEY COMPLETE</h2>
  <p id="endScore"></p>
  <button id="restart">PLAY AGAIN</button>
</section>

</main>

<script>

/*
=========================================================
ANSWER DATABASE
=========================================================

The game supplements its own answer bank with the public
Krillion archive on GitHub.

The archive only contains sampled answers for old prompts.
It cannot supply answers for every custom question.

To add an answer:
"answer": [points, "Tier name"]

Allowed points:
10, 15, 30, 60, 85, 100

=========================================================
*/

const DATA_URL =
"https://raw.githubusercontent.com/StruggleYang/krillion-dataset/main/data/krillion_dives.json";

const QUESTIONS = [

{
 category:"MATHEMATICS",
 q:"Name a type of number.",
 answers:{
  "integer":[10,"Plankton"],
  "prime number":[15,"Too Clever"],
  "irrational number":[30,"Schooler"],
  "complex number":[30,"Schooler"],
  "transcendental number":[60,"Rare"],
  "algebraic number":[60,"Rare"],
  "p-adic number":[85,"Deep Cut"],
  "surreal number":[85,"Deep Cut"],
  "quaternion":[100,"One in a Billi-on"]
 }
},

{
 category:"COMPUTER SCIENCE",
 q:"Name a programming language.",
 answers:{
  "python":[10,"Plankton"],
  "java":[15,"Too Clever"],
  "javascript":[15,"Too Clever"],
  "c++":[30,"Schooler"],
  "rust":[60,"Rare"],
  "haskell":[85,"Deep Cut"],
  "prolog":[85,"Deep Cut"],
  "ocaml":[100,"One in a Billi-on"],
  "erlang":[100,"One in a Billi-on"]
 }
},

{
 category:"USA",
 q:"Name a US national park.",
 answers:{
  "yellowstone":[10,"Plankton"],
  "yosemite":[15,"Too Clever"],
  "grand canyon":[15,"Too Clever"],
  "zion":[30,"Schooler"],
  "acadia":[30,"Schooler"],
  "badlands":[60,"Rare"],
  "congaree":[85,"Deep Cut"],
  "isle royale":[85,"Deep Cut"],
  "pinnacles":[100,"One in a Billi-on"]
 }
},

{
 category:"INDIA",
 q:"Name a city in India.",
 answers:{
  "mumbai":[10,"Plankton"],
  "delhi":[10,"Plankton"],
  "jaipur":[15,"Too Clever"],
  "hyderabad":[15,"Too Clever"],
  "kochi":[30,"Schooler"],
  "indore":[30,"Schooler"],
  "shillong":[60,"Rare"],
  "mysuru":[60,"Rare"],
  "itanagar":[85,"Deep Cut"],
  "dibrugarh":[85,"Deep Cut"],
  "aizawl":[100,"One in a Billi-on"]
 }
},

{
 category:"FOOD",
 q:"Name a type of cheese.",
 answers:{
  "cheddar":[10,"Plankton"],
  "mozzarella":[10,"Plankton"],
  "brie":[15,"Too Clever"],
  "gouda":[30,"Schooler"],
  "halloumi":[30,"Schooler"],
  "paneer":[15,"Too Clever"],
  "taleggio":[60,"Rare"],
  "mimolette":[85,"Deep Cut"],
  "caciocavallo":[100,"One in a Billi-on"],
  "epoisses":[85,"Deep Cut"]
 }
},

{
 category:"GEOGRAPHY",
 q:"Name a country that shares a land border with India.",
 answers:{
  "pakistan":[10,"Plankton"],
  "china":[10,"Plankton"],
  "nepal":[15,"Too Clever"],
  "bangladesh":[15,"Too Clever"],
  "bhutan":[30,"Schooler"],
  "myanmar":[60,"Rare"]
 }
},

{
 category:"HARRY POTTER",
 q:"Name a Harry Potter character other than Harry, Ron or Hermione.",
 answers:{
  "dumbledore":[10,"Plankton"],
  "draco malfoy":[15,"Too Clever"],
  "hagrid":[15,"Too Clever"],
  "luna lovegood":[30,"Schooler"],
  "neville longbottom":[30,"Schooler"],
  "nymphadora tonks":[60,"Rare"],
  "kingsley shacklebolt":[85,"Deep Cut"],
  "mundungus fletcher":[100,"One in a Billi-on"],
  "fleur delacour":[60,"Rare"],
  "gilderoy lockhart":[30,"Schooler"]
 }
},

{
 category:"INTERSTELLAR",
 q:"Name a planet or celestial object featured in Interstellar.",
 answers:{
  "earth":[10,"Plankton"],
  "saturn":[15,"Too Clever"],
  "miller's planet":[30,"Schooler"],
  "miller planet":[30,"Schooler"],
  "mann's planet":[30,"Schooler"],
  "mann planet":[30,"Schooler"],
  "edmunds' planet":[60,"Rare"],
  "edmunds planet":[60,"Rare"],
  "gargantua":[85,"Deep Cut"],
  "water planet":[30,"Schooler"],
  "ice planet":[60,"Rare"]
 }
}

];

/* Game state */

let current = 0;
let score = 0;
let locked = false;
let archiveReady = false;

const $ = id => document.getElementById(id);

function normalise(text) {
 return text.toLowerCase()
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[’']/g,"'")
  .replace(/[^a-z0-9+#' -]/g,"")
  .replace(/\s+/g," ")
  .trim();
}

/*
Load public Krillion data.

It imports sampled answers when an archived prompt
matches one of the game's prompts.
*/

async function loadArchive() {
 try {
  const response = await fetch(DATA_URL);

  if (!response.ok) throw new Error("Archive unavailable");

  const dives = await response.json();

  let imported = 0;

  for (const dive of dives) {
   for (const prompt of (dive.prompts || [])) {

    const matchingQuestion = QUESTIONS.find(
     q => normalise(q.q) === normalise(prompt.q)
    );

    if (!matchingQuestion) continue;

    for (const tier of (prompt.tiers || [])) {
     for (const answer of (tier.picks || [])) {

      const points = {
       "Plankton":10,
       "Too Clever":15,
       "Schooler":30,
       "Rare":60,
       "Deep Cut":85,
       "One in a Krillion":100
      }[tier.name];

      if (points && !matchingQuestion.answers[normalise(answer)]) {
       matchingQuestion.answers[normalise(answer)] = [
        points,
        points === 100 ? "One in a Billi-on" : tier.name
       ];
       imported++;
      }
     }
    }
   }
  }

  archiveReady = true;
  $("sourceStatus").textContent =
   "Public archive loaded. " + imported +
   " additional matching answers imported.";

 } catch(error) {
  $("sourceStatus").textContent =
   "Using the built-in answer bank. Public archive could not be reached.";
 }
}

/* Find a submitted answer */

function checkAnswer(question, submitted) {

 const guess = normalise(submitted);

 if (!guess) return null;

 for (const [answer, result] of Object.entries(question.answers)) {

  if (normalise(answer) === guess) {
   return result;
  }

  // Also accept simple plural forms.
  if (
   normalise(answer + "s") === guess ||
   normalise(answer + "es") === guess
  ) {
   return result;
  }
 }

 return null;
}

/* Rank labels */

function getRank(points) {
 if (points === 100) return "ONE IN A BILLI-ON";
 if (points === 85) return "DEEP CUT";
 if (points === 60) return "RARE";
 if (points === 30) return "SCHOOLER";
 if (points === 15) return "TOO CLEVER";
 return "PLANKTON";
}

/* Move Bhargavi according to score */

function moveBhargavi() {

 const maximum = QUESTIONS.length * 100;

 const progress = Math.min(
  94,
  4 + (score / maximum) * 88
 );

 $("character").style.left = progress + "%";
 $("catLabel").style.left = progress + "%";
}

/* Show a question */

function showQuestion() {

 locked = false;

 const item = QUESTIONS[current];

 $("round").textContent = current + 1;
 $("category").textContent = item.category;
 $("question").textContent = item.q;
 $("score").textContent = score;
 $("rank").textContent = score ? getRank(score) : "PLANKTON";

 $("answer").value = "";
 $("answer").disabled = false;
 $("submit").disabled = false;
 $("submit").textContent = "SUBMIT";
 $("feedback").textContent = "";

 $("answer").focus();
}

/* Submission */

$("answerForm").addEventListener("submit", function(event) {

 event.preventDefault();

 // After a successful answer, the button becomes NEXT.
 if (locked) {
  current++;

  if (current >= QUESTIONS.length) {
   finishGame();
  } else {
   showQuestion();
  }

  return;
 }

 const submitted = $("answer").value;
 const result = checkAnswer(QUESTIONS[current], submitted);

 if (!result) {
  $("feedback").textContent =
   "ANSWER NOT FOUND. Try another valid answer or spelling.";
  $("answer").focus();
  return;
 }

 locked = true;

 const points = result[0];
 const tier = result[1];

 score += points;

 $("score").textContent = score;
 $("rank").textContent = getRank(points);

 $("feedback").textContent =
  "✓ " + tier.toUpperCase() +
  "  +" + points + " POINTS! BHARGAVI MOVES!";

 $("answer").disabled = true;
 $("submit").textContent = "NEXT";

 moveBhargavi();
});

/* End game */

function finishGame() {

 $("game").style.display = "none";
 $("end").style.display = "block";

 const maximum = QUESTIONS.length * 100;

 $("endTitle").textContent =
  score === maximum
   ? "ONE IN A BILLI-ON!"
   : "COSMIC JOURNEY COMPLETE";

 $("endScore").textContent =
  "BHARGAVI SCORED " + score + " OUT OF " + maximum + " POINTS.";
}

/* Restart */

$("restart").addEventListener("click", function() {

 current = 0;
 score = 0;

 $("end").style.display = "none";
 $("game").style.display = "block";

 $("character").style.left = "4%";
 $("catLabel").style.left = "4%";

 showQuestion();
});

/* Upload your own Bhargavi meme */

$("memeUpload").addEventListener("change", function(event) {

 const file = event.target.files[0];

 if (!file) return;

 const reader = new FileReader();

 reader.onload = function() {

  $("catImage").src = reader.result;
  $("catImage").style.display = "block";
  $("placeholder").style.display = "none";

  try {
   localStorage.setItem("bhargaviMeme",reader.result);
  } catch(error) {
   console.log("Image could not be saved between sessions.");
  }
 };

 reader.readAsDataURL(file);
});

/* Restore uploaded character */

try {

 const savedImage = localStorage.getItem("bhargaviMeme");

 if (savedImage) {
  $("catImage").src = savedImage;
  $("catImage").style.display = "block";
  $("placeholder").style.display = "none";
 }

} catch(error) {}

/* Start immediately */

showQuestion();
loadArchive();

</script>
</body>
</html>
